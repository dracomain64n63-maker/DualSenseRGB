
name: Build DualSense RGB IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project DualSenseRGB.xcodeproj \
            -scheme DualSenseRGB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/DualSenseRGB.app package/Payload/
          cd package
          zip -r ../DualSenseRGB-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DualSenseRGB-unsigned-IPA
          path: DualSenseRGB-unsigned.ipa
